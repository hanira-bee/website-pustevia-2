<?php
session_start();

// Handle logout
if ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['logout'])) {
    session_destroy();
    header("Location: " . $_SERVER['PHP_SELF']);
    exit;
}

// Handle login
if ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['username'], $_POST['password'])) {
    $username = $_POST['username'];
    $password = $_POST['password'];

    // Dummy credential check - replace with your own authentication
    if ($username === 'user' && $password === 'pass') {
        $_SESSION['logged_in'] = true;
        header("Location: " . $_SERVER['PHP_SELF']);
        exit;
    } else {
        $login_error = 'Invalid username or password';
    }
}
?>

<!-- Profile Overlay -->
<div id="profileOverlay" class="overlay" aria-hidden="true" aria-label="Profile information overlay">
  <div class="overlay-content" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
    <button class="close-btn" id="closeProfile" aria-label="Close profile overlay">&times;</button>
    <h2 id="profileTitle">Your Profile</h2>
    <div class="profile-info">
      Welcome back, <strong>User</strong>!<br />
      Email: user@example.com
    </div>
    <form method="post" action="">
      <input type="hidden" name="logout" value="1" />
      <input type="submit" value="Logout" />
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const accountBtn = document.getElementById('accountBtn');

    const loginOverlay = document.getElementById('loginOverlay');
    const closeLogin = document.getElementById('closeLogin');

    const profileOverlay = document.getElementById('profileOverlay');
    const closeProfile = document.getElementById('closeProfile');

    // PHP injected variable for login status (true or false)
    const loggedIn = <?php echo (isset($_SESSION['logged_in']) && $_SESSION['logged_in']) ? 'true' : 'false'; ?>

    // Function to open overlay according to login state
    function openOverlay() {
      if(loggedIn) {
        profileOverlay.classList.add('active');
        profileOverlay.setAttribute('aria-hidden', 'false');
      } else {
        loginOverlay.classList.add('active');
        loginOverlay.setAttribute('aria-hidden', 'false');
      }
    }

    function closeOverlays() {
      loginOverlay.classList.remove('active');
      loginOverlay.setAttribute('aria-hidden', 'true');
      profileOverlay.classList.remove('active');
      profileOverlay.setAttribute('aria-hidden', 'true');
    }

    accountBtn.addEventListener('click', openOverlay);
    closeLogin.addEventListener('click', closeOverlays);
    closeProfile.addEventListener('click', closeOverlays);

    // Close when clicking outside content
    loginOverlay.addEventListener('click', (e) => {
      if (e.target === loginOverlay) closeOverlays();
    });
    profileOverlay.addEventListener('click', (e) => {
      if (e.target === profileOverlay) closeOverlays();
    });

    // Accessibility: Close on Escape key
    document.addEventListener('keydown', (e) => {
      if(e.key === "Escape") {
        closeOverlays();
      }
    })
  });
</script>

</body>
